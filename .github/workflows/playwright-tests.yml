
name: Playwright Python Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playwright-python-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run pytest tests
        run: |
          mkdir -p test-results
          python -m pytest --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results --junitxml=test-results/pytest-results.xml

      - name: Upload test results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-python-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-python-html-report
          path: reports/report.html
          if-no-files-found: error
          retention-days: 14

      - name: Prepare GitHub Pages report
        if: always() && github.event_name != 'pull_request'
        env:
          TZ: America/New_York
        run: |
          mkdir -p pages

          if [ -f reports/report.html ]; then
            cp reports/report.html pages/index.html

            RUN_DATE=$(date '+%B %d, %Y at %I:%M %p %Z')

            python3 - "$RUN_DATE" <<'PY'
          import sys
          from pathlib import Path
          from html import escape

          report = Path("pages/index.html")
          html = report.read_text(encoding="utf-8")
          timestamp = escape(sys.argv[1])

          html = html.replace(
              '<h1 id="title">report.html</h1>',
              f'<h1 id="title">Playwright Python Test Report</h1><p><strong>Last run:</strong> {timestamp}</p>',
              1
          )

          report.write_text(html, encoding="utf-8")
          PY
          else
            echo "<h1>Test report unavailable</h1>" > pages/index.html
          fi

      - name: Upload GitHub Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5
